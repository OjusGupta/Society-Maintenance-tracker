<g fill="#FDE68A" opacity="0.9">
<rect x="172" y="286" width="26" height="26"/>
<rect x="212" y="286" width="26" height="26"/>
<rect x="292" y="286" width="26" height="26"/>
<rect x="172" y="326" width="26" height="26"/>
<rect x="252" y="326" width="26" height="26"/>
<rect x="292" y="326" width="26" height="26"/>
<rect x="212" y="366" width="26" height="26"/>
<rect x="252" y="366" width="26" height="26"/>
<rect x="172" y="406" width="26" height="26"/>
<rect x="292" y="406" width="26" height="26"/>
<rect x="172" y="446" width="26" height="26"/>
<rect x="212" y="446" width="26" height="26"/>
