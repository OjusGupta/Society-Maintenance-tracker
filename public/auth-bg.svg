<rect x="222" y="560" width="56" height="80" fill="#1E1B4B"/>
<circle cx="266" cy="600" r="2.5" fill="#FDE68A"/>

<!-- other side building -->
<rect x="360" y="380" width="110" height="260" fill="#3730A3"/>
<g fill="#FDE68A" opacity="0.85">
<rect x="378" y="404" width="18" height="18"/>
<rect x="410" y="404" width="18" height="18"/>
<rect x="442" y="404" width="18" height="18"/>
