<svg width="480" height="720" viewBox="0 0 480 720" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Illustrated modern apartment building at dusk</title>
<defs>
<linearGradient id="skyauth" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#312E81"/>
<stop offset="100%" stop-color="#4F46E5"/>
</linearGradient>
</defs>
<rect x="0" y="0" width="480" height="720" fill="url(#skyauth)"/>
<circle cx="380" cy="120" r="60" fill="#FDE68A" opacity="0.85"/>
